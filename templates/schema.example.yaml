entities:
  - name: 管理员
    primary_key: id
    rank: left
    attributes: [id, 用户名, 密码, 头像, 角色]
  - name: 用户
    primary_key: 编号
    rank: right
    attributes: [编号, 用户名, 密码, 头像, 角色]
  - name: 留言
    primary_key: 留言编号
    rank: middle
    attributes: [留言编号, 内容, 发布时间]
  - name: 公告
    primary_key: 公告编号
    rank: middle
    attributes: [公告编号, 标题, 内容, 发布时间]
  - name: 收藏
    primary_key: 收藏编号
    rank: middle
    attributes: [收藏编号, 收藏时间]
  - name: 服装
    primary_key: 服装编号
    rank: middle
    attributes: [服装编号, 名称, 款式, 适合场合, 颜色, 图片, 材质, 介绍]

relationships:
  - name: 管理
    from: 管理员
    to: 留言
    from_cardinality: "1"
    to_cardinality: "N"
  - name: 管理
    from: 管理员
    to: 公告
    from_cardinality: "1"
    to_cardinality: "N"
  - name: 管理
    from: 管理员
    to: 收藏
    from_cardinality: "1"
    to_cardinality: "N"
  - name: 管理
    from: 管理员
    to: 服装
    from_cardinality: "1"
    to_cardinality: "N"
  - name: 发布
    from: 留言
    to: 用户
    from_cardinality: "M"
    to_cardinality: "N"
  - name: 查看
    from: 公告
    to: 用户
    from_cardinality: "M"
    to_cardinality: "N"
  - name: 添加
    from: 收藏
    to: 用户
    from_cardinality: "M"
    to_cardinality: "N"
  - name: 穿搭
    from: 服装
    to: 用户
    from_cardinality: "M"
    to_cardinality: "N"
    attributes: [信息, 建议, 分享]

